<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Flux Analyzer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#252629;font:15px/1.65 system-ui,sans-serif}header{padding:20px 32px;background:#fff;border-bottom:1px solid #deddd7}header a{color:#bd2434;font-weight:700;text-decoration:none}main{max-width:1360px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding:32px}nav a{display:block;padding:8px 12px;color:#53545a;text-decoration:none;border-radius:6px}nav a[aria-current=page]{background:#fff;color:#bd2434;font-weight:650}article{background:#fff;padding:30px 40px;border:1px solid #deddd7;border-radius:12px;max-width:950px;overflow-wrap:anywhere}h1,h2,h3{line-height:1.25;margin:32px 0 16px}h1{margin-top:0}h2{border-top:1px solid #eee;padding-top:24px}p{margin:12px 0}code{background:#f3f2ee;padding:2px 5px;border-radius:3px;font-size:13px}pre{background:#f3f2ee;padding:16px;overflow:auto;white-space:pre}pre code{padding:0}.bullet{padding-left:18px}a{color:#a51c2b}@media(max-width:800px){main{display:block;padding:16px}nav{margin-bottom:20px;display:flex;gap:6px;flex-wrap:wrap}nav a{font-size:12px;padding:5px 8px}article{padding:24px}}
</style></head><body><header><a href="/">Flux Analyzer</a> / Documentation</header><main><nav aria-label="Documentation">{% for key,label in documents.items() %}<a href="/docs?doc={{ key }}" {% if selected==key %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav><article>{{ content }}</article></main></body></html>
